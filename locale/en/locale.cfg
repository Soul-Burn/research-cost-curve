[mod-setting-name]
rcc-multiplicative=Multiplicative factor
rcc-additive=Additive factor
rcc-maximum=Maximum multiplier value
rcc-minimum=Minimum multiplier value
rcc-print=Print updates
rcc-fixed-cost=Fixed science cost
rcc-ignore-infinite=Ignore infinite research

[mod-setting-description]
rcc-multiplicative=Multiplies science cost by this amount on research completion
rcc-additive=Adds this value to science cost on research completion (after multiplication)
rcc-maximum=Maximum value for multiplier
rcc-minimum=Maximum value for multiplier
rcc-print=Prints the updated multiplier on research completion
rcc-fixed-cost=Set all non-infinite sciences to this cost when greater than 0
rcc-ignore-infinite=Makes infinite research ignore cost multiplier. Only affect actual infinite research, not prerequisites
